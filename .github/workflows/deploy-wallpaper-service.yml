name: Build Paper Nexus

on:
  push:
    branches: ['main']
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: |
        tag="${{ github.ref_name }}"
        runNumber="${{ github.run_number }}"
        if [[ "$tag" =~ ^v([0-9]+) ]]; then
          buildNum="${BASH_REMATCH[1]}"
        else
          buildNum="$runNumber"
        fi

        # One single-file, self-contained binary per supported platform.
        for rid in win-x64 linux-x64; do
          dotnet publish PaperNexus/PaperNexus.csproj \
            --configuration Release \
            --runtime "$rid" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -p:Version="$buildNum.0.0" \
            --output "./publish/$rid"
        done

        # The auto-updater looks the Linux asset up by this exact name.
        mv ./publish/linux-x64/PaperNexus ./publish/linux-x64/PaperNexus-linux-x64
        chmod +x ./publish/linux-x64/PaperNexus-linux-x64

    - name: Install signing tools
      run: sudo apt-get install -y osslsigncode

    - name: Sign executable (self-signed)
      env:
        SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
        SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        GH_TOKEN: ${{ secrets.GH_PAT }}
      run: |
        pfxPath="/tmp/papernexus-sign.pfx"
        certPassword="$SIGNING_CERTIFICATE_PASSWORD"
        needsNewCert=false

        if [[ -n "$SIGNING_CERTIFICATE" ]]; then
          echo "$SIGNING_CERTIFICATE" | base64 -d > "$pfxPath"
          notAfter=$(openssl pkcs12 -in "$pfxPath" -passin "pass:$certPassword" -nokeys -clcerts 2>/dev/null \
            | openssl x509 -noout -enddate | cut -d= -f2)
          expiryEpoch=$(date -d "$notAfter" +%s)
          nowEpoch=$(date +%s)
          daysUntilExpiry=$(( (expiryEpoch - nowEpoch) / 86400 ))

          if [[ $daysUntilExpiry -le 30 ]]; then
            echo "Certificate expires in $daysUntilExpiry day(s) — regenerating."
            needsNewCert=true
          else
            echo "Certificate valid for $daysUntilExpiry more day(s) — reusing."
          fi
        else
          needsNewCert=true
        fi

        if [[ "$needsNewCert" == "true" ]]; then
          certPassword=$(openssl rand -hex 16)
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem -out /tmp/cert.pem \
            -days 1825 -nodes -subj "/CN=PaperNexus"
          openssl pkcs12 -export -out "$pfxPath" -inkey /tmp/key.pem -in /tmp/cert.pem \
            -passout "pass:$certPassword"
          rm -f /tmp/key.pem /tmp/cert.pem

          if [[ -n "$GH_TOKEN" ]]; then
            base64 -w0 "$pfxPath" | gh secret set SIGNING_CERTIFICATE --repo '${{ github.repository }}'
            echo "$certPassword" | gh secret set SIGNING_CERTIFICATE_PASSWORD --repo '${{ github.repository }}'
            echo "Signing certificate generated and stored as repository secrets."
          else
            echo "WARNING: GH_PAT not set — cert is ephemeral for this run. Add a GH_PAT secret (secrets:write) to persist it."
          fi
        fi

        osslsigncode sign \
          -pkcs12 "$pfxPath" \
          -pass "$certPassword" \
          -h sha256 \
          -t http://timestamp.digicert.com \
          -in ./publish/win-x64/PaperNexus.exe \
          -out ./publish/win-x64/PaperNexus-signed.exe
        mv ./publish/win-x64/PaperNexus-signed.exe ./publish/win-x64/PaperNexus.exe
        rm -f "$pfxPath"

    # Authenticode is a PE-only format, so the Linux build's integrity is published as a
    # SHA-256 digest instead. The auto-updater refuses any Linux update without this file.
    - name: Checksum Linux binary
      working-directory: ./publish/linux-x64
      run: sha256sum PaperNexus-linux-x64 > PaperNexus-linux-x64.sha256

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        install_section='## Installation
        Download **PaperNexus.exe** below and run it — the app installs itself to `%LocalAppData%\PaperNexus\` on first launch and adds a tray icon.'

        if [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
          newTag="${{ github.ref_name }}"

          # Fetch GitHub's auto-generated PR/commit notes for this tag, then prepend the install section.
          generated=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$newTag" \
            -f target_commitish="${{ github.sha }}" \
            --jq '.body' 2>/dev/null || echo "")

          notes=$(printf '%s\n\n%s' "$install_section" "$generated")
        else
          newTag="v${{ github.run_number }}"

          # For main branch builds, list commits since the last tag as the changelog.
          lastTag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$lastTag" ]]; then
            commitList=$(git log "$lastTag"..HEAD --oneline --no-decorate | sed 's/^/- /')
            changeSection=$(printf '## Changes since %s\n%s' "$lastTag" "$commitList")
          else
            commitList=$(git log --oneline --no-decorate --max-count=20 | sed 's/^/- /')
            changeSection=$(printf '## Recent changes\n%s' "$commitList")
          fi

          notes=$(printf '> ⚠️ Development build — may be unstable.\n\n%s\n\n%s' \
            "$install_section" "$changeSection")
        fi

        gh release create "$newTag" \
          --title "Paper Nexus $newTag" \
          --notes "$notes" \
          ./publish/win-x64/PaperNexus.exe \
          ./publish/linux-x64/PaperNexus-linux-x64 \
          ./publish/linux-x64/PaperNexus-linux-x64.sha256
        echo "NEW_TAG=$newTag" >> "$GITHUB_ENV"

    - name: Delete previous releases
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release list --limit 200 --json tagName --jq '.[].tagName' \
          | grep -v "^${NEW_TAG}$" \
          | xargs -r -I{} gh release delete {} --yes --cleanup-tag 2>/dev/null || true
